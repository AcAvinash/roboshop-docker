

version: '3.9'

networks:
  roboshop:
    driver: bridge

services:
  mongodb:
    image: acavinash/mongodb:v1
    container_name: mongodb
    networks:
      - roboshop

  catalogue:
    image: acavinash/catalogue:v1
    container_name: catalogue
    networks:
      - roboshop
    depends_on:
      - mongodb

  redis:
    image: redis:7.0-alpine
    container_name: redis
    networks:
      - roboshop

  user:
    image: acavinash/user:v1
    container_name: user
    networks:
      - roboshop
    depends_on:
      - mongodb
      - redis

  cart:
    image: acavinash/cart:v1
    container_name: cart
    networks:
      - roboshop
    depends_on:
      - redis
      - catalogue


  mysql:
    image: acavinash/mysql:v2
    container_name: mysql
    networks:
      - roboshop
    volumes:
      - mysql:/var/lib/mysql

  shipping:
    image: acavinash/shipping:v1
    container_name: shipping
    networks:
      - roboshop
    depends_on:
      - mysql
    environment:
      - JAVA_OPTS=-Xmx256m -Xms128m
    command: ["java", "-Xmx256m", "-Xms128m", "-jar", "shipping.jar"]

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    networks:
      - roboshop
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=roboshop
      - RABBITMQ_DEFAULT_PASS=roboshop123

  payment:
    image: acavinash/payment:v1
    container_name: payment
    networks:
      - roboshop
    depends_on:
      - cart
      - user
      - rabbitmq

  # dispatch:
  #   image: dispatch:v1
  #   container_name: dispatch
  #   networks:
  #     - roboshop
  #   depends_on:
  #     - rabbitmq

  web:
    image: web:v1
    container_name: web
    networks:
      - roboshop
    ports:
      - 80:80
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment

volumes:
  mysql: {}
  rabbitmq: {}
